2026-10-04:
  Dmeto:
  - bugfix: fixed Kilo Ordnance igniter not igniting.
  - map: minor changes to Kilo Ordnance pipe devices.
  Fghj240:
  - balance: explosions inflict wounds
  - balance: explosions respect ear protection
  - balance: bomb armor reduces damage of devastating explosions
  - balance: bomb armor can reduce explosive damage by 60% instead of just 50%
  - balance: bomb armor respects locations and doesn't always spread damage equally
  - balance: devastating explosion damage increased from 500 to 600
  - balance: devastating explosion damage split between brute and burn (instead of
      brute only)
  - balance: devastating explosions deal ear damage and paralysis in case they're
      survived
  - bugfix: aliens are knocked out by heavy explosions, not light ones
  Jacquerel:
  - balance: Instead of directly transferring money to your account, the crab-17 phone
      is now equipped with a printer that disgorges bank notes at regular intervals.
  Melbert:
  - qol: When attempting to craft a recipe which has a craftable component, you can
      hover over said component to see its recipe. If that recipe has a craftable
      component, you can then hover over that, and so on.... allowing you to view
      entire recipes without losing your original place in the UI.
  - qol: Food crafting menu no longer has a third tab for "food type", you can instead
      filter by "food type" the same way you filter by cuisine or dish type on the
      left
  - qol: Food crafting menu now informs you of alternate sources of ingredients, such
      as from the biogenerator
  - rscdel: Removed the ingredient choice beacon from the chef's roundstart equipment
  - rscadd: Adds the cooking voucher to the chef's roundstart equipment, redeem it
      at your produce order console to get 10 free ingredients of your choice
  - rscadd: Tweaked the limit on the number of items you can purchase per (mining/bitrunning/chef)
      order. Before it was a flat 20, but the UI sometimes lied to you and said it
      was either 50 or 10. Now it's scaled directly based on how valuable the item
      is (where cheaper items allow for bulk orders).
  - code_imp: Improved performance of talking a little bit, report anything weird
      you notice (particularly with emphasis characters)
  - bugfix: Fix night vision goggles
  - qol: You can lean on jukeboxes
  - bugfix: Large wings are now fully affected by suit meshes or voidwalker curse
  - bugfix: Cream pies no longer get affected by suit meshes or voidwalker curse
  - refactor: Refactored bodypart rendering ever so slightly to fix some bodypart
      texture issues, report anything weird like missing overlays
  - image: Gauze now shows up on your sprite
  - sound: Gauze now plays a rip sound when applied
  - sound: Sutures now play a snip sound when applied
  - rscadd: Gauze can now ALWAYS be applied to a bodypart, no longer requiring a wound
      be present. (Note gauze alternatives like duct tape still require a wound be
      present).
  - rscadd: Gauze can now be removed by hand, both from your own body or from others.
  - balance: Gauze no longer deletes itself when used up, instead dropping "used gauze".
      Used gauze can be washed to reuse it, but this has diminishing returns.
  - balance: If you sustain a wound to an already gauzed limb, the gauze will sustain
      a significant amount of wear, potentially even destroying it.
  PapaMichael:
  - spellcheck: Welded airlocks' tooltips don't suggest you can weld them shut again
  - bugfix: Failing to cuff an item no longer affects your arm's click cooldown
  Swan:
  - bugfix: fixes TGUI crashing when reseting to default a keybind which has no default
      binding
  btcbuster:
  - spellcheck: fixed the description of soup pots
  hry-gh:
  - refactor: the lobby menu now lives on the client, but should look and function
      identically
  lelandkemble:
  - bugfix: Red & Blue cubes do not entangle you to your previous mount anymore
  mc-oofert:
  - bugfix: fixed odd lighting in some hallways in the NT Museum away mission
  necromanceranne:
  - balance: You can purchase syringe guns as a single-pack goodie from cargo.
  - rscadd: Adds the Overconfident quirk! You got this!
  timothymtorres:
  - bugfix: Fix seclite overlay for SMG disablers
  - bugfix: Fix incorrect scaling for breath code heat messages.
  - bugfix: Fix breath temperature skipping damage effects in very rare situations.
  - refactor: Slight refactor of breath code temperature checks to be faster and cleaner.
  - bugfix: Fix singularity runtime with thrown objects
  vinylspiders:
  - bugfix: fixes a bug that could cause a number of weighted rng events to not behave
      as intended
  - bugfix: the plantalyzer light level reading will now show accurately again
  - bugfix: fixes a memory leak in the tgui layout component
  - bugfix: fixes an issue with looping sounds on machines like the oven/deepfryer,
      please report any strange issues
  - bugfix: invalid loadout gags colors now get sanitized
