author: "Hardly, Absolucy, Siro, Nerev4r"
delete-after: True
changes:
  - spellcheck: "Adds the wiki's slime lore into their in-game lore description"
  - balance: "As soon as slimes are wet they'll start losing slime jelly and regeneration rather than having to be wet enough to trigger them"
  - balance: "Splashing water into slimes directly damages their jelly (blood) now"
  - qol: "Turns the wet/dry slime debuffs into a status effect, making it clearer on whenever you (the slime) are losing jelly or not"
  - code_imp: "Slime Action backgrounds were changed to be consistent"
  - balance: "Wet/Dry slimes will lose slime jelly a bit faster, from 2 units to 3 units per tick"
  - code_imp: "Healing particle uses the slime's mutant color"
  - code_imp: "New say verbs for slimes"
  - bugfix: "Getting (shuttle)gibbed or chasmed no longer means round removal for slimes, your core should always drop on death (except cremation or admin abuse)"
  - bugfix: "Slimes can now get fished out of the chasm, easier with a rescue hook"
  - balance: "Slime cores will remain inside legions and vileworms until the mob is dealt with"
  - balance: "Slime cores now keeps the items inside them on death rather than dropping them all"
  - qol: "Slimes have their core's GPS turned on by default"
  - rscadd: "Dead slimes now have the ability to murmur for help"
  - qol: "Added screentips for the slime core"
  - code_imp: "If you're evil, clicking on a slime core now lets you take all the items. Right clicking on a slime core lets you take their GPS off"
  - balance: "Halves the time it takes to steal the core's goodies or turn the GPS off from 30 seconds to 15 seconds"
  - qol: "Revival policy shows up for slimes on revival"
  - spellcheck: "New descriptions for slime cores that should be clearer than before"
  - bugfix: "Slime Changelings will die normally instead of turning into a slime core, which would previously round remove them"
  - code_imp: "Hydrophobia slime ability dries the user"
  - refactor: "Slime Cleaning code is now cleaner, and with that, they can also clean things by crawling onto them!"
  - balance: "Slime hydrophobia halts passive regeneration"
  - balance: "Slime hydrophobia prevents you from regenerating your limbs"
  - bugfix: "Slimes no longer turn into a core in bitrunning/deathmatch, preventing unintended behavior"