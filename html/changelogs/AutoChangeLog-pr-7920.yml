author: "Neocloudy"
delete-after: True
changes:
  - map: "NorthStar: Received a lot of tweaks in general, see PR 7920 for mostly full list of changes."
  - map: "NorthStar: On Deck 1, there are now cryo pods nearby Supply/connected to Arrivals on the port side. This is the fastest way to leave the game from Supply."
  - map: "NorthStar: On Deck 2, there are now cryo pods next to Medical/neighboring Virology and Science on the starboard side. This is the fastest way to leave the game from Engineering, Medical or Science."
  - map: "NorthStar: Adjusted the appearance of Deck 3's Cryogenics."
  - map: "NorthStar: Removed an unneeded camera from the Delivery Office."
  - map: "NorthStar: Science Break Room can't be seen from the main Science area, has better wallmount placement, and functional disposals."
  - map: "NorthStar: Apartments have curtains that you can close."
  - map: "NorthStar: Third Floor Starboard Maint is slightly more lit, as opposed to not lit at all. Second Floor Starboard Maint also receives a few more lights."
  - map: "NorthStar: Medical uses new tiles that play around the presence of decals in the Treatment Center and hallways."
  - map: "NorthStar: Connected Medical Cryogenics to the scrubbers network, so CO2 from people in the pods is actually sent away."
  - map: "NorthStar: Psychologist's Office (main) is covered by a camera."
  - map: "NorthStar: The quantum pad from Robotics to Research and Development is linked at the start of the round."