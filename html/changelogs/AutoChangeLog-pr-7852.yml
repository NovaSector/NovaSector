author: "Neocloudy"
delete-after: True
changes:
  - map: "NorthStar: The Cook/Chef/whatever will now have CQC in the Diner area. The one actually outside their Kitchen."
  - map: "NorthStar: If the Captain renames the ship, the announcement will actually say ship rather than station."
  - map: "NorthStar: Tweaked a lot of egregious decals."
  - map: "NorthStar: Delayed unrestricted access is now used in all locations except Medical, Science, Escape Pods and that one maintenance room that Assistants can spawn in."
  - map: "NorthStar: This means that if you're in maintenance without proper access, exiting maintenance will take longer due to the use of delayed unrestricted access."
  - map: "NorthStar: Some very specific spots deep inside maintenance that didn't have any unrestricted access now have delayed unrestricted access, so it's now more likely that you have at least one (slow!) path to exit maintenance, even without access."
  - map: "Updated Nova map commission plaques."